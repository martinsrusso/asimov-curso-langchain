[project]
name = "asimov-curso-langchain"
version = "0.1.0"
description = "Curso LangChain 1.0 na prática - Asimov Academy"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "ipykernel>=7.3.0",
    "langchain>=1.4.2",
    "langchain-core>=1.6.3",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.2",
]

[tool.uv]
package = false

[tool.pylint.messages_control]
disable = [
    "C0413",  # wrong-import-position (comum e esperado em notebooks interativos)
]
